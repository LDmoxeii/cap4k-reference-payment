      在跨越独立 contract 边界时显式映射为 Endpoint Response。
    result: pending
    reason: null
  - id: A10
    source: brief.md
    text: A10：有效商户以 `K-001`、`O-001`、`100.00 CNY` 创建支付时得到稳定 PaymentId 和 `PENDING`
      状态，不产生支付成功事实；零金额、超精度金额、未支持币种或无有效渠道配置时不创建支付。
    result: pending
    reason: null
  - id: A11
    source: brief.md
    text: A11：相同商户和幂等键重复提交相同内容时返回同一 PaymentId；关键内容冲突时明确失败，数据库中不新增 Payment 或
      PaymentAttempt。
    result: pending
    reason: null
  - id: A12
    source: brief.md
    text: A12：对 `PENDING` Payment 发起支付尝试时新增独立 PaymentAttempt；Fake Channel Gateway
      只返回“已受理”，Payment 进入 `PROCESSING`，不得因此形成成功收入或成功通知事实。
    result: pending
    reason: null
  - id: A13
    source: brief.md
    text: A13：来源不可信、支付尝试身份不匹配、金额不符或币种不符的渠道结果不能推进 Payment
      状态；接收事实、`ChannelResultDisposition` 与拒绝原因仍可查询。
    result: pending
    reason: null
  - id: A14
    source: brief.md
    text: A14：可信且匹配的成功结果只把 Payment 确认成功一次，并记录渠道交易号、业务发生时间和平台接收时间；相同通知重复到达形成
      duplicate disposition 并增加接收次数，不重复形成成功事实。
    result: pending
    reason: null
  - id: A15
    source: brief.md
    text: A15：Payment 成功后不得再主动创建新的 PaymentAttempt；后续失败结果不得回退成功状态，并以 conflict
      disposition 留痕。
    result: pending
    reason: null
