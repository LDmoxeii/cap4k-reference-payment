known_gaps:
  - B3 deliberately uses PullChannelStatement provider pull as the primary statement path; bill-arrival Integration Event transport remains deferred to B5.
  - Published cap4k 2.0.1 does not expose the current mainline Pipeline DSL used by B1-B4; published-coordinate cold start remains deferred to B6.
  - Current Analyzer output proves twelve independent Endpoint HTTP Actor-to-Command roots and four Time roots. Command/Query/Capability/Domain Event anchors and Aggregate element structure are reviewed through independent Drawing Board partitions; hidden handlers/entity methods, runtime state transitions, and cross-entry process stitching remain outside the default Flow contract.
  - Agent Snapshot remains partial only because the DB source is live external input whose freshness is intentionally UNKNOWN; ordinary plan evidence is readable, ownership contains 170 items, Analyzer is ok with 39 available outputs, and diagnostics are empty with zero errors, INVALID entries, or plan-evidence-invalid warnings.
  - B4 ordinary schedulers plus synchronous Fake Transfer/Verifier prove only the reference settlement loop; they do not prove PAY-EV-017, Outbox, reliable Command/Event, Integration Event transport, persistent scheduling, lease/retry, or cross-instance exactly-once.
  - Production authentication, real payment/refund/statement/bank/clearing protocols, cryptographic verification, sensitive-data storage, negative-net recovery, weekly settlement, reliable asynchronous transport, and published-coordinate cold start remain outside B1-B4.
  - Reconciliation and merchant-settlement composite uniqueness is enforced by the runtime H2 schema where the current aggregate generator does not emit the required composite or effective-slot constraints; generated entity ownership is not altered.
  - flows/index.json inputDirs remain machine-local locator metadata and are not treated as portable committed evidence; stable identity is tracked upstream.
  - Jimmer projection and only-engine addon verification remain explicitly deferred.
