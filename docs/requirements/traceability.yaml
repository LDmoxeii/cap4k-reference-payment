known_gaps:
  - Inbound reconciliation transport must be selected during Build shape: provider pull or bill-arrival Integration Event.
  - Published cap4k 2.0.1 does not expose the current mainline Pipeline DSL used by B1; published-coordinate cold start remains deferred to B6.
  - Current Analyzer output intentionally proves three independent Endpoint HTTP Actor-to-Command causal flows. Command/Query anchors and Aggregate element structure are reviewed through their independent Drawing Board partitions; Query, hidden handlers/entity methods, runtime state transitions, and cross-entry process stitching are outside the default Flow contract.
  - Agent Snapshot remains partial only because the DB source is live external input whose freshness is intentionally UNKNOWN; ordinary plan evidence is readable, ownership contains 41 items, Analyzer is ok, and there are zero diagnostics, errors, INVALID entries, or plan-evidence-invalid warnings.
  - Production authentication, real payment provider protocols, cryptographic verification, and sensitive-data storage remain out of B1 scope.
  - Focused fixture ownership must be linked for ORM extreme graphs, provider conflicts, transport retries, and pathological concurrency.
  - Jimmer projection and only-engine addon verification remain explicitly out of scope for the first Build.
