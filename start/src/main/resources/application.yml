spring:
  datasource:
    url: jdbc:h2:mem:payment-reference;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

payment:
  sandbox:
    channel-id: C-001
    verification-secret: test-secret
